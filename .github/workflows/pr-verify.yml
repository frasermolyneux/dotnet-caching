name: PR Verify

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_report: ${{ steps.shared-tests-1.outputs.test-report }}
    steps:
      - id: shared-tests-1
        uses: frasermolyneux/actions/dotnet-ci@dotnet-ci/v2.1
        with:
          test-reporting: "true"
          src-folder: src
          dotnet-version: |
            9.0.x
            10.0.x

  test-results:
    name: Test results summary
    if: always() && github.event.pull_request.draft == false
    needs: [build-and-test]
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    concurrency:
      group: test-results-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: frasermolyneux/actions/test-results-summary@test-results-summary/v1
        with:
          jobs: ${{ toJSON(needs) }}
