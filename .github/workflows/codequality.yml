name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "15 8 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      actions: read
    uses: frasermolyneux/actions/.github/workflows/repository-analysis-sonar.yml@repository-analysis-sonar/v1.1.0
    with:
      profile: ${{ vars.REPOSITORY_ANALYSIS_PROFILE }}
      recipe: ${{ vars.REPOSITORY_ANALYSIS_SONAR_RECIPE }}
      build: ${{ vars.REPOSITORY_ANALYSIS_BUILD }}
      expected-sha: ${{ github.sha }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  native-codeql:
    if: github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: frasermolyneux/actions/.github/workflows/repository-analysis-codeql.yml@repository-analysis-codeql/v1.0.0
    with:
      profile: ${{ vars.REPOSITORY_ANALYSIS_PROFILE }}
      build: ${{ vars.REPOSITORY_ANALYSIS_BUILD }}
      source-directory: ${{ fromJSON(vars.REPOSITORY_ANALYSIS_SONAR_RECIPE).sourceDirectory }}
      expected-sha: ${{ github.sha }}
  codeql:
    if: github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: frasermolyneux/actions/.github/workflows/codequality.yml@37c6a8a3461d7cfe61907b4ef450a248578a9009
    with:
      skip-sonar: true
      sonar-project-key: frasermolyneux_dotnet-caching
      test-reporting: true
      build-target: dotnet-ci
      skip-format-check: true
      dotnet-version: |
        9.0.x
        10.0.x
      src-folder: src
  devops-secure-scanning:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    uses: frasermolyneux/actions/.github/workflows/devops-secure-scanning.yml@main
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          comment-summary-in-pr: always
