name: Build and Test

on:
  push:
    branches:
      - feature/**
      - bugfix/**
      - hotfix/**

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: frasermolyneux/actions/dotnet-ci@a6271c58ed8e8f3b6fbdb738ac7566863fdc38c8 # dotnet-ci/v2.1.2
        with:
          test-reporting: "true"
          src-folder: src
          dotnet-version: |
            9.0.x
            10.0.x
